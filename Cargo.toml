[package]
name = "busk"
version = "0.1.0"
edition = "2021"
description = "A keyboard-driven D-Bus explorer and debugger TUI — browse services, introspect objects, call methods, and monitor signals, all in your terminal."
license = "MIT"
keywords = ["dbus", "tui", "debugger", "linux"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
ratatui = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
zbus = { version = "4", default-features = false, features = ["tokio"] }
zbus_xml = "4"
